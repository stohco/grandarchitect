    - apothecary
    - blacksmith_artifact_workshop
    - market_auction_house
    - village_shrine
    - town_wall_gate_bridge
    - sect_mountain_gate
    - disciple_dormitories
    - scripture_library
    - alchemy_hall
    - artifact_refining_hall
    - formation_tower
    - beast_pen_spirit_garden
    - elder_residence
    - ancestor_sanctuary
    - cliff_cave_abode
    - secret_realm_ruin
    - immortal_palace
    - floating_island_complex
    - ocean_sect_harbor
    - underwater_ruin
    - star_travel_platform

ui:
  philosophy: clean_modern_cultivation_survival
  direct_copy_of_other_game: false
  base_resolution: [1920, 1080]
  safe_area_px: 24
  scale_range_percent: [80, 150]
  dom:
    HUD_PLAYER_STATUS:
      anchor: top_left
      size_px: [360, 132]
    HUD_QUEST_TRACKER:
      anchor: left
      size_px: [380, 220]
    HUD_COMPASS:
      anchor: top_center
      size_px: [620, 46]
    HUD_MINIMAP:
      anchor: top_right
      size_px: [236, 236]
    HUD_TARGET_STATUS:
      anchor: top_center
      size_px: [420, 76]
    HUD_TECHNIQUE_QUICKBAR:
      anchor: bottom_center
      size_px: [620, 104]
    HUD_CONTEXT_ACTIONS:
      anchor: bottom_right
      size_px: [300, 150]
    HUD_CROSSHAIR:
      anchor: center
      size_px: [48, 48]
  technique_wheel_categories:
    - cultivator_attack
    - cultivator_defense
    - body_arts
    - movement
    - divine_sense
    - sword_arts
    - flying_swords
    - artifacts
    - formations
    - talismans
    - alchemy_utilities
    - summons_beasts

reference_sheets:
  resolution: [3840, 2160]
  min_heading_px: 52
  min_body_label_px: 28
  max_major_panels: 12
  required:
    - SHEET_01_CHARACTER_FACTORY
    - SHEET_02_TERRAIN_NATURE_FACTORY
    - SHEET_03_STRUCTURE_PROP_FACTORY
    - SHEET_04_GAMEPLAY_UI_RENDER
    - SHEET_05_CREATURE_EFFECT_FACTORY
    - SHEET_06_ANIMATION_FACTORY
    - SHEET_07_LIGHTING_WEATHER
    - SHEET_08_UI_DOM_MAP

pipeline_gates:
  - brief
  - silhouette
  - blockout_scale
  - topology
  - uv
  - texturing
  - rigging
  - animation
  - lod_impostor
  - collision_navigation
  - integration
  - qa

acceptance:
  - vlm_can_identify_every_panel_and_asset_id
  - text_only_glm_can_reconstruct_requirements
  - base_underwear_model_is_complete_and_rigged
  - equipment_is_independently_swappable
  - body_hide_zones_are_reversible
  - shared_art_direction_across_all_asset_categories
  - high_quality_painterly_render_not_retro
  - clean_readable_hud
  - every_asset_has_lod_collision_scale_naming_and_qa
