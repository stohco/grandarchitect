render_budget:
  full_player_triangles:
    lod0: [60000, 100000]
    lod1: [30000, 55000]
    lod2: [12000, 25000]
    lod3: [4000, 8000]
  named_npc_triangles:
    lod0: [35000, 75000]
  generic_npc_triangles:
    lod0: [20000, 45000]
  normal_creature_triangles:
    lod0: [18000, 55000]
  boss_triangles:
    lod0: [60000, 180000]
  hero_weapon_triangles:
    lod0: [6000, 18000]

materials:
  channels:
    - BaseColor
    - Normal
    - ORM
    - Emissive
    - DyeMask
  optional_channels:
    - DetailMask
    - SubsurfaceMask
    - DamageMask
  hero_texel_density_px_per_m: [512, 768]
  npc_texel_density_px_per_m: [256, 512]
  environment_texel_density_px_per_m: [128, 256]

terrain:
  scale_layers:
    macro_m: [256, 8000]
    meso_m: [8, 256]
    micro_m: [0.01, 8]
  destructible:
    authoritative_representation: density_or_sparse_voxel_field
    visible_representation: smooth_derived_mesh
    near_cell_size_m: [0.25, 0.5]
    requirements:
      - watertight_surface
      - atomic_visual_and_collision_activation
      - affected_cell_only_invalidation
      - correct_new_cut_material
      - material_specific_debris
      - cultivation_strength_thresholds
  biome_examples:
    - mortal_river_valley
    - cloud_immortal_peak
    - ancient_sword_scar
    - alchemy_volcanic_basin
    - ghost_marsh
    - star_desert
    - spirit_ocean_archipelago
    - frozen_tribulation_plateau

architecture:
  snap_grid_m: 0.5
  sub_grid_m: 0.1
  required_modules:
    - foundation
    - floor
    - column
    - beam
    - bracket
    - wall
    - door
    - window
    - roof_corner
    - roof_edge
    - roof_ridge
    - stair
    - railing
    - balcony
    - trim
    - interior_partition
    - destruction_pieces
    - collision_proxy
    - lods
  required_kits:
